name: Bug report
description: Report a problem with a java-toolkit utility
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: input
    id: version
    attributes:
      label: java-toolkit version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: e.g. Temurin 21.0.4
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the utility/class involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or steps that reproduce the issue.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace / logs (if any)
      render: shell
    validations:
      required: false
