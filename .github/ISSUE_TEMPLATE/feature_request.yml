name: Feature request
description: Suggest a new utility or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the utility/API you'd like. A sketch of the method signatures is helpful.
      render: java
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: dependencies
    attributes:
      label: Dependencies
      options:
        - label: This can be implemented with the JDK or the existing core dependencies (no new heavy dependency)
