# Builds and verifies the project (tests, coverage gate, Spotless, Error Prone, SpotBugs).
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21' ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and verify
        run: mvn -B verify

  # Aggregation gate: exposes a single, stable status check ("ci-success") that
  # is independent of the build matrix. Set this as the required status check in
  # branch protection instead of the matrix-dependent "build (21)" context.
  ci-success:
    name: ci-success
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify build job succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build job did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All required jobs succeeded."

